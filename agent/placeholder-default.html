<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Display screen</title>
<style>
  html,body{height:100%;margin:0}
  body{background:#0e1320;color:#e6e9f0;font-family:system-ui,Segoe UI,Roboto,Arial,sans-serif;
       display:flex;align-items:center;justify-content:center;text-align:center}
  .box{max-width:48rem;padding:2rem}
  .dot{display:inline-block;width:.7rem;height:.7rem;border-radius:50%;background:#20c997;
       box-shadow:0 0 10px #20c997;margin-right:.5rem;vertical-align:middle}
  h1{font-size:2.4rem;font-weight:600;margin:.2rem 0 1rem}
  p{font-size:1.2rem;color:#9aa4b8;margin:.3rem 0}
  .brand{font-size:1rem;letter-spacing:.08em;text-transform:uppercase;color:#6b768c;margin-bottom:1.5rem}
</style>
</head>
<body>
  <div class="box">
    <div class="brand"><span class="dot"></span>Display Screens</div>
    <h1>No content set for this screen</h1>
    <p>This screen is set to show a web kiosk, but no page has been assigned yet.</p>
    <p>Pick a web kiosk for it in the Display Screen Manager and it will appear here automatically.</p>
  </div>
</body>
</html>
